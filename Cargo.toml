[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/formetaohy/Flint"

[workspace.dependencies]
flint-error = { path = "crates/flint-error" }
flint-num = { path = "crates/flint-num" }
flint-checkpoint = { path = "crates/flint-checkpoint" }
flint-tensor = { path = "crates/flint-tensor" }
flint-kernel = { path = "crates/flint-kernel" }
flint-backend = { path = "crates/flint-backend" }
flint-model = { path = "crates/flint-model" }
flint-architectures = { path = "crates/flint-architectures" }
flint-tokenizer = { path = "crates/flint-tokenizer" }
flint-generate = { path = "crates/flint-generate" }
flint-onnx = { path = "crates/flint-onnx" }
flint-profiler = { path = "crates/flint-profiler" }

ahash = "0.8.12"
bytemuck = "1.25.2"
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.11"
memmap2 = "0.9.11"
prost = "0.13"
prost-build = "0.13"
protox = "0.8"
ureq = { version = "2.12", features = ["gzip"] }
pollster = "1.0.1"
safetensors = "0.8.0"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = "0.23.1"
wgpu = "30.0.0"

[package]
name = "flint"
version.workspace = true
edition.workspace = true

[dependencies]
flint-architectures.workspace = true
flint-backend.workspace = true
flint-error.workspace = true
flint-generate.workspace = true
flint-onnx.workspace = true
clap.workspace = true
env_logger.workspace = true
serde_json.workspace = true
