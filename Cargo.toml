[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/formetaohy/Flint"

[workspace.dependencies]
flint-error = { path = "crates/flint-error" }
flint-num = { path = "crates/flint-num" }
flint-gpu = { path = "crates/flint-gpu" }
flint-checkpoint = { path = "crates/flint-checkpoint" }
flint-tensor = { path = "crates/flint-tensor" }
flint-kernel = { path = "crates/flint-kernel" }
flint-backend = { path = "crates/flint-backend" }
flint-model = { path = "crates/flint-model" }
flint-architectures = { path = "crates/flint-architectures" }
flint-tokenizer = { path = "crates/flint-tokenizer" }
flint-generate = { path = "crates/flint-generate" }
flint-onnx = { path = "crates/flint-onnx" }
flint-profiler = { path = "crates/flint-profiler" }

ahash = "0.8.12"
bytemuck = "1.25.2"
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.11"
memmap2 = "0.9.11"
pollster = "0.4"
prost = "0.13"
prost-build = "0.13"
protox = "0.8"
safetensors = "0.8.0"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
ureq = { version = "2", features = ["json", "proxy-from-env"] }
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "std", "parking_lot"] }
