[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/formetaohy/Thuban"

[workspace.dependencies]
thuban_architectures = { path = "crates/thuban_architectures", version = "0.1.0" }
thuban_backend = { path = "crates/thuban_backend", version = "0.1.0" }
thuban_checkpoint = { path = "crates/thuban_checkpoint", version = "0.1.0" }
thuban_error = { path = "crates/thuban_error", version = "0.1.0" }
thuban_fetch = { path = "crates/thuban_fetch", version = "0.1.0" }
thuban_generate = { path = "crates/thuban_generate", version = "0.1.0" }
thuban_gpu = { path = "crates/thuban_gpu", version = "0.1.0" }
thuban_kernel = { path = "crates/thuban_kernel", version = "0.1.0" }
thuban_model = { path = "crates/thuban_model", version = "0.1.0" }
thuban_num = { path = "crates/thuban_num", version = "0.1.0" }
thuban_profiler = { path = "crates/thuban_profiler", version = "0.1.0" }
thuban_server = { path = "crates/thuban_server", version = "0.1.0" }
thuban_tensor = { path = "crates/thuban_tensor", version = "0.1.0" }
thuban_tokenizer = { path = "crates/thuban_tokenizer", version = "0.1.0" }

ahash = "0.8.12"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytemuck = "1.25.2"
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.11"
futures-core = "0.3"
futures-util = "0.3"
memmap2 = "0.9.11"
pollster = "0.4"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "2", features = ["json", "proxy-from-env"] }
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "std", "parking_lot"] }
