name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan (lavapipe) and spirv-val
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers spirv-tools
          ICD="$(find /usr/share/vulkan/icd.d/ -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD" || { echo "::error::lavapipe ICD manifest not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --exclude thuban_backend --exclude thuban_model --exclude thuban_architectures --exclude thuban_generate

  source-package:
    name: Source package
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version =/{print $3; exit}' Cargo.toml | tr -d '"')"
          test "$version" = "$workspace_version" || { echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${workspace_version}"; exit 1; }
          echo "PACKAGE_VERSION=${version//./-}" >> "$GITHUB_ENV"
          for format in tar.gz zip; do
            git archive --format="$format" --prefix="thuban-${version}/" -o "thuban-${version}.${format}" HEAD
          done
      - uses: actions/upload-artifact@v4
        with:
          name: thuban-source-${{ env.PACKAGE_VERSION }}
          path: |
            thuban-*.tar.gz
            thuban-*.zip
